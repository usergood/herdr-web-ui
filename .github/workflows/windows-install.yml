name: Windows install
# A separately controlled live installation acceptance run; no automatic/scheduled workloads.
on:
  workflow_dispatch:
    inputs:
      update_from:
        description: Optional previous owned fork release tag
        type: string
        required: false
      update_to:
        description: Optional newer owned fork release tag
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: windows-install-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    name: Real Windows install
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure only this runner's Herdr
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'saurons-install-config'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $path = Join-Path $dir 'config.toml'
          "[update]`nversion_check = false`nmanifest_check = false`n" | Set-Content -LiteralPath $path -Encoding utf8
          "HERDR_CONFIG_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install the reviewed commit without release history
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-install-e2e.ps1 -Ref $env:GITHUB_SHA -Fresh
      - name: Update between explicit owned fork releases
        if: inputs.update_from != '' || inputs.update_to != ''
        env:
          UPDATE_FROM: ${{ inputs.update_from }}
          UPDATE_TO: ${{ inputs.update_to }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-install-e2e.ps1 -Update -UpdateFrom $env:UPDATE_FROM -UpdateTo $env:UPDATE_TO
