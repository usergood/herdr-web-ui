name: Release
# Installs discover Git tags directly. Never create a tag until its exact commit passes CI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already merged into main (X.Y.Z, without v)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Validate version, notes and unused tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bun scripts/release-notes.ts "$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo 'This version already has a tag; choose a new version.' >&2
            exit 1
          fi
  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      full: true
  publish:
    needs: validate
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Publish the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch origin main --tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          bun scripts/release-notes.ts "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo 'Tag appeared during validation; refusing to publish it.' >&2
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Saurons eye v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
