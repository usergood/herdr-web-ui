name: CI
on:
  pull_request:
    # Automatic runs are fast; dispatch full=true before merging source changes.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run full Linux, Windows and macOS validation
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
permissions:
  contents: read
env:
  BUN_VERSION: 1.4.2
concurrency:
  group: validation-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.run_fast }}
      full: ${{ steps.filter.outputs.run_full }}
      draft: ${{ steps.filter.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: filter
        env:
          CI_FULL: ${{ inputs.full || false }}
        run: |
          set -euo pipefail
          base="$(jq -r '.pull_request.base.sha // .before // empty' "$GITHUB_EVENT_PATH")"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$base" ]; then
            git diff --name-only -z "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
          else
            git ls-files -z > "$RUNNER_TEMP/changed-paths"
          fi
          bun scripts/ci-policy.ts "$RUNNER_TEMP/changed-paths"
  windows-install:
    name: Native Windows install
    needs: [changes, fast]
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      HERDR_TEST_MODE: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-windows-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-windows-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      # A required check: a draft run must not report it green without running it, or a stale
      # draft result could satisfy the merge gate. Marking the PR ready reruns CI.
      - name: Fail on draft PRs (Windows tests not run)
        if: needs.changes.outputs.draft == 'true'
        run: |
          Write-Host "::error::Draft PR: the Windows install tests did not run. Mark the PR ready for review to run them."
          exit 1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-install.test.ps1
        if: needs.changes.outputs.draft != 'true'
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/preflight.ps1
        if: needs.changes.outputs.draft != 'true'
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.draft != 'true'
      - run: bun run build
        if: needs.changes.outputs.draft != 'true'
      - run: bun test ./scripts/windows-plugin.test.ts ./scripts/plugin-runtime.test.ts ./scripts/phone-setup.test.ts ./server/windows-native.test.ts
        if: needs.changes.outputs.draft != 'true'
  macos-session:
    name: Native macOS session identity
    needs: [changes, fast]
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 5
    env:
      HERDR_TEST_MODE: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-macos-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-macos-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Skip heavy tests on draft PRs
        if: needs.changes.outputs.draft == 'true'
        run: |
          echo "Draft PR detected, skipping macOS tests"
          exit 0
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.draft != 'true'
      - run: bun test ./server/claude-store.test.ts ./server/process-start.test.ts
        if: needs.changes.outputs.draft != 'true'
  fast:
    name: Fast checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHECK_DIR: ${{ github.workspace }}/.ci
      UNIT_TEST_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-linux-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run check fast
      - name: Preserve check report and verification logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 1
          name: check-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/report.json
            .ci/**/*.log
            .ci/browser-evidence/**/*.png
            .ci/browser-evidence/**/*.json
            .ci/browser-evidence/**/*.zip
          include-hidden-files: true
          if-no-files-found: ignore
  integration:
    name: Integration tests
    needs: [changes, fast]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHECK_DIR: ${{ github.workspace }}/.ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-linux-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Skip heavy tests on draft PRs
        if: needs.changes.outputs.draft == 'true'
        run: |
          echo "Draft PR detected, skipping integration tests"
          exit 0
      - name: Install checksum-pinned herdr 0.9.3
        if: needs.changes.outputs.draft != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/herdr-bin"
          curl --fail --location --retry 3 https://github.com/herdrdev/herdr/releases/download/v0.9.3/herdr-linux-x86_64 -o "$RUNNER_TEMP/herdr-bin/herdr"
          echo "18a8dc65f1c2fa485884344356dea1cfd911c6f06cf46fa78e193f4087f4dba7  $RUNNER_TEMP/herdr-bin/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.draft != 'true'
      - name: Integration tests (updater restart and rollback included)
        if: needs.changes.outputs.draft != 'true'
        run: bun run check integration
      - name: Preserve check report and verification logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 1
          name: integration-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/report.json
            .ci/**/*.log
            .ci/config/herdr/sessions/*/test-server.log
          include-hidden-files: true
          if-no-files-found: ignore
  browser-main:
    name: Browser regression (ui-regression)
    needs: [changes, fast]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHECK_DIR: ${{ github.workspace }}/.ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-linux-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Skip heavy tests on draft PRs
        if: needs.changes.outputs.draft == 'true'
        run: |
          echo "Draft PR detected, skipping browser-main tests"
          exit 0
      - name: Install checksum-pinned herdr 0.9.3
        if: needs.changes.outputs.draft != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/herdr-bin"
          curl --fail --location --retry 3 https://github.com/herdrdev/herdr/releases/download/v0.9.3/herdr-linux-x86_64 -o "$RUNNER_TEMP/herdr-bin/herdr"
          echo "18a8dc65f1c2fa485884344356dea1cfd911c6f06cf46fa78e193f4087f4dba7  $RUNNER_TEMP/herdr-bin/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.draft != 'true'
      - name: Get Playwright version
        if: needs.changes.outputs.draft != 'true'
        id: playwright-version
        run: echo "version=$(bun -e 'console.log(require("playwright-core/package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        if: needs.changes.outputs.draft != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-linux-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - run: bun run build
        if: needs.changes.outputs.draft != 'true'
      - name: Browser regression (ui-regression.ts)
        if: needs.changes.outputs.draft != 'true'
        env:
          BROWSER_SCRIPTS: scripts/ui-regression.ts
        run: bun scripts/ci-browser-parallel.ts
      - name: Preserve browser logs and evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 1
          name: browser-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/browser-logs/**
            .ci/browser-evidence/**/*.png
            .ci/browser-evidence/**/*.json
            .ci/browser-evidence/**/*.zip
          include-hidden-files: true
          if-no-files-found: ignore
  browser-other:
    name: Browser regression (other scripts)
    needs: [changes, fast]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHECK_DIR: ${{ github.workspace }}/.ci
      BROWSER_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-linux-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Skip heavy tests on draft PRs
        if: needs.changes.outputs.draft == 'true'
        run: |
          echo "Draft PR detected, skipping browser-other tests"
          exit 0
      - name: Install checksum-pinned herdr 0.9.3
        if: needs.changes.outputs.draft != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/herdr-bin"
          curl --fail --location --retry 3 https://github.com/herdrdev/herdr/releases/download/v0.9.3/herdr-linux-x86_64 -o "$RUNNER_TEMP/herdr-bin/herdr"
          echo "18a8dc65f1c2fa485884344356dea1cfd911c6f06cf46fa78e193f4087f4dba7  $RUNNER_TEMP/herdr-bin/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
        if: needs.changes.outputs.draft != 'true'
      - name: Get Playwright version
        if: needs.changes.outputs.draft != 'true'
        id: playwright-version
        run: echo "version=$(bun -e 'console.log(require("playwright-core/package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        if: needs.changes.outputs.draft != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-linux-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - run: bun run build
        if: needs.changes.outputs.draft != 'true'
      - name: Browser regression (parallel)
        if: needs.changes.outputs.draft != 'true'
        env:
          # Every script of scripts/ci-browser.sh except the one browser-main runs.
          BROWSER_EXCLUDE: scripts/ui-regression.ts
        run: bun scripts/ci-browser-parallel.ts
      - name: Preserve browser logs and evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 1
          name: browser-other-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/browser-logs/**
            .ci/browser-evidence/**/*.png
            .ci/browser-evidence/**/*.json
            .ci/browser-evidence/**/*.zip
          include-hidden-files: true
          if-no-files-found: ignore
  integration-browser:
    name: ${{ needs.changes.outputs.full == 'true' && 'Integration and browser' || 'Full validation not requested' }}
    needs: [changes, integration, browser-main, browser-other]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.changes.outputs.full }}" != "true" ]; then
            echo "Fast validation only. Dispatch CI with full=true for the Integration and browser merge gate."
            exit 0
          fi
          if [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            echo "Skipped: only documentation changes"
            exit 0
          fi
          # A required check: a draft run skipped the heavy tests, so it must not report green,
          # or a stale draft result could satisfy the merge gate. Marking the PR ready reruns CI.
          if [ "${{ needs.changes.outputs.draft }}" = "true" ]; then
            echo "::error::Draft PR: integration and browser tests did not run. Mark the PR ready for review to run them."
            exit 1
          fi
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [ "${{ needs.browser-main.result }}" != "success" ]; then
            echo "Browser regression (ui-regression) failed"
            exit 1
          fi
          if [ "${{ needs.browser-other.result }}" != "success" ]; then
            echo "Browser regression (other scripts) failed"
            exit 1
          fi
          echo "All tests passed"
